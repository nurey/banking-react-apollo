server {
    listen       80;
    listen  [::]:80;

    root   /usr/share/nginx/html;

    # Text assets are compressed at build time (see Dockerfile); serve the .br or
    # .gz copy when the client accepts it.
    brotli_static on;
    gzip_static   on;
    # Anything without a pre-compressed copy is compressed on the fly.
    brotli        on;
    brotli_types  text/css application/javascript application/json image/svg+xml;
    gzip          on;
    gzip_types    text/css application/javascript application/json image/svg+xml;
    gzip_vary     on;

    # Built assets have content-hashed names that change every build, so they can
    # be cached forever. A missing one is a 404, not index.html served as JS/CSS.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (and the SPA fallback) must be revalidated on every load, or
    # browsers keep running the previous build after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
