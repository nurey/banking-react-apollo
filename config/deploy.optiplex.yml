# LAN deployment to optiplex: kamal deploy -d optiplex
# Shares optiplex's kamal-proxy with the budgetr backend, which is its catch-all route.

# Own repository: the API URI is baked in, so tags must not collide with production's
image: nurey/budgetr-frontend-optiplex

servers:
  web:
    hosts:
      - 10.0.0.218

builder:
  args:
    VITE_GRAPHQL_URI: http://10.0.0.218/graphql

proxy:
  ssl: false
  # Local DNS record in pihole (homelab repo: stacks/pihole/docker-compose.yml)
  host: budgetr.lan
