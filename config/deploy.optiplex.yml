# LAN deployment to optiplex: kamal deploy -d optiplex
# Shares optiplex's kamal-proxy with the budgetr backend, which is its catch-all route.
#
# Uses the same image as production: the app picks its API from the page's host
# (src/utils/graphqlUri.js), so a tested image can be promoted with
#   kamal deploy --skip-push

servers:
  web:
    hosts:
      - optiplex

proxy:
  ssl: false
  # Local DNS record in pihole (homelab repo: stacks/pihole/docker-compose.yml)
  host: budgetr.lan
